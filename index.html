<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e6e9ec" />
    <meta
      name="description"
      content="A little space for your sound. Your own music, beautifully at home."
    />
    <link rel="icon" type="image/svg+xml" href="/Media-thingy/favicon.svg" />
    <title>media. — A space for your sound</title>
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("media-theme");
        } catch {}
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        let scale = 115;
        try {
          const raw = localStorage.getItem("media-ui-scale");
          const value = raw === null ? 115 : Number(raw);
          if (Number.isFinite(value))
            scale = Math.round(Math.min(150, Math.max(100, value)) / 5) * 5;
        } catch {}
        document.documentElement.style.setProperty(
          "--ui-scale",
          String(scale / 100),
        );
        document.documentElement.dataset.uiScale = String(scale);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#15171b" : "#e6e9ec";
      })();
    </script>
    <script type="module" crossorigin src="/Media-thingy/assets/index-ULW_A7Dv.js"></script>
    <link rel="stylesheet" crossorigin href="/Media-thingy/assets/index-fFCShvPB.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
